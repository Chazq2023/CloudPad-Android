name: Build APK Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'readme assets/**'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_NOTES: |-
        - Added 1440p as a resolution option for Game Library (PSCloud) and Game Catalog (PSNow) streaming, alongside 720p and 1080p.
        - FSR 1 Upscaling now supports a 1440p stream, upscaling it to 2160p (4K) on supporting displays, matching the existing 720p→1080p and 1080p→1440p upscale tiers.
        - Reduced packet loss during streaming: the WiFi lock now requests low-latency mode (Android 10+) instead of high-performance mode, which also disables background WiFi scans during a stream; the network socket now has a dedicated read thread so a slow frame decode can no longer delay draining incoming packets and cause the phone to silently drop them internally; and a warning is now logged if the OS caps the receive buffer below what was requested.
        - Translated the new 1440p and FSR messaging into every supported language (German, Spanish, Finnish, French, Indonesian, Italian, Japanese, Korean, Dutch, Portuguese (Brazil)).
        - Fixed a gap where entirely dropped video frames (as opposed to partial frame corruption) weren't counted as packet loss, which could let the streaming server keep raising the bitrate through a real run of dropped frames instead of backing off.
        - Fixed Cloud Play (Game Library/Game Catalog) sometimes getting stuck asking you to log in again right after logging in successfully, and never recovering even after reinstalling. The app was generating a brand new random device ID for every single stream launch instead of a stable one for the install, which could make PlayStation's fraud detection treat the account as logging in from a different device each time and start rejecting it — reinstalling couldn't fix this since the rejection lives on PlayStation's servers, not the device. The device ID is now generated once and reused.
        - Fixed "Login Required" popping up repeatedly and clearing a perfectly valid login. An ordinary network hiccup or other unrelated error while loading Game Library/Game Catalog could be misread as an expired login (the check was matching overly broad words like "failed" that show up in almost any error message), which wiped the saved login and asked you to sign in again — even though nothing was actually wrong with it. That check is now far more specific to real login failures.
        - Added "Open Quick Settings" to the remappable controls in Controller Settings, defaulted to the back button/key and combo-capable like the touchpad mappings. This gives TV users a way to reach the in-stream Quick Settings panel for the first time — previously back on TV only showed a disconnect confirmation and the panel wasn't reachable at all.
        - If Game Catalog (PS3/PS4) ever fails to load with "Failed to fetch stores" or a similar error, the message shown now includes the actual underlying cause instead of a generic line, so it can be diagnosed from a screenshot alone. The underlying cause itself isn't fixed by this — this only makes it possible to tell what it is when it happens.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install Python grpc tools
        run: |
          python3 -m pip install --only-binary=:all: grpcio-tools

      - name: Validate Discord release webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *)
              echo "::error::DISCORD_RELEASE_WEBHOOK_URL is missing or is not a valid Discord webhook URL."
              exit 1
              ;;
          esac

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          # This job builds the *debug* variant (see the "Build APK" step below) and signs it
          # with this keystore — never falling back to Android's auto-generated debug key,
          # since that key is regenerated fresh on every ephemeral Actions runner, so a release
          # built without it carries a different signature than every other release; users who
          # installed one would then hit "App not installed as package conflicts with an
          # existing package" on their next update and have to uninstall + reinstall to recover.
          # Hard-fail here so a missing/misconfigured secret can't silently ship a mismatched
          # signature.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ]; then
            echo "::error::One or more PYLUX_KEYSTORE_* secrets (PYLUX_KEYSTORE_BASE64, PYLUX_KEYSTORE_STORE_PASSWORD, PYLUX_KEYSTORE_KEY_ALIAS, PYLUX_KEYSTORE_KEY_PASSWORD) are missing. Set them in Settings > Secrets and variables > Actions before releasing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
          # app/build.gradle resolves this path via Gradle's file(), which is relative to the
          # *app* module dir (android/app), not this "android" working-directory — so reaching
          # the keystore written one line above (at android/pylux-release.jks) needs exactly
          # one "..", not "../android/..". Matches the working local.properties convention
          # already used for local debug builds (chiakiKeystore=../pylux-debug.jks).
          echo "chiakiKeystore=../pylux-release.jks" >> local.properties
          echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
          echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
          echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
          echo "Signing enabled"

      # Runs before the build (not after, as this used to) — the version it computes is baked
      # into the APK itself via ANDROID_VERSION_NAME below, so the tag a GitHub Release is filed
      # under and the version the resulting app actually reports in Settings > About now match.
      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.1.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.1\.//')
            VERSION="0.1.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp "frontend assets/cloudpad-hero.png" release/cloudpad-hero.png
          cp "frontend assets/cloudpad-icon.png" release/cloudpad-icon.png
          cp "frontend assets/cloudpad-logo.png" release/cloudpad-logo.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            ${{ env.RELEASE_NOTES }}

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png

      - name: Announce release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg url "$RELEASE_URL" \
            '{
              username: "CloudPad Releases",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("CloudPad Beta " + $version + " is available"),
                description: $notes,
                url: $url,
                color: 16738740,
                fields: [{
                  name: "Download",
                  value: ("[View release and download the APK](" + $url + ")")
                }]
              }]
            }' > discord-payload.json

          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json" \
            --data @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true"
