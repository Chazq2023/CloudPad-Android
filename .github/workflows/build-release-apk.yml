name: Build APK Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install protoc and Python grpc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install grpcio-tools

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
            echo "chiakiKeystore=../android/pylux-release.jks" >> local.properties
            echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
            echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
            echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
            echo "Signing enabled"
          else
            echo "No keystore secret found — build will use default debug signing (updates may require reinstall)"
          fi

      # Runs before the build (not after, as this used to) — the version it computes is baked
      # into the APK itself via ANDROID_VERSION_NAME below, so the tag a GitHub Release is filed
      # under and the version the resulting app actually reports in Settings > About now match.
      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.1.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.1\.//')
            VERSION="0.1.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp android/app/src/main/assets/FrontendArt/cloudpad-hero.png release/cloudpad-hero.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-icon.png release/cloudpad-icon.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-logo.png release/cloudpad-logo.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            - Fixed PSN sign-in failing with "Can't connect to the server" — sign-in now opens in Chrome instead of an in-app browser, which Sony's own fraud detection was rejecting.
            - Sign-in is now a guided four-step flow: sign in with Sony, obtain your login token, paste it in, then finalise.
            - Fixed the Cloud Play tab's LOGIN button being unreachable with a controller — the whole screen was getting the focus highlight instead of the button itself.

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png
