name: Build APK Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'readme assets/**'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_NOTES: |-
        - Replaced the Adaptive Frame Pacing switch with a Video Pacing setting: Standard (lowest latency) or Smooth (steadier motion, adds a little latency on unstable connections). If you had Adaptive Frame Pacing on, you are moved to Smooth.
        - You can now change Video Pacing from the in-stream settings menu, just above Image Quality, and it takes effect instantly, without restarting the stream.
        - Improved frame pacing for 30 fps games on Game Library and Game Catalog: the stream is now paced to the game's real frame rate, which fixes uneven motion and stops Smooth from adding unnecessary delay.
        - Smooth mode now limits how much delay it can add on poor connections.
        - Added a Session timer (hh:mm:ss) to the performance overlay, under Res in Minimal and under Visual in Full. It starts at 00:00:00 when each stream connects, and the time is shown in green.
        - The Add Game page is now titled Add Game to PS5 Library. A line under the title shows how many games are displayed out of the total, and a filter narrows the list: All, Purchasable (games you need to buy), PS Catalog, PS Plus (games included with PS Plus through the Game Catalog or as a monthly game, e.g. NEVA; not game trials or member discounts) or Free to Play. Every game shows under at least one filter. PS Plus information is a download of about 25 MB that happens in the background, is saved for a week, and is refreshed whenever you tap the refresh button.
        - Clearing the search box with the X on the Add Game page no longer pops up the keyboard, and searching or changing the filter there now jumps straight back to the top of the list, like the library tabs.
        - Added Indonesian (Bahasa Indonesia) as an app language.
        - Translated the Add Game to PS5 Library page, the Video Pacing setting and the trophy refresh button into every supported language (German, Spanish, Finnish, French, Italian, Japanese, Korean, Dutch, Portuguese (Brazil)); Indonesian already had them. Also fixed missing closing quotation marks in three German texts.
        - Fixed the selected tab (PS3 Catalog, PS4 Catalog or PS5 Library) losing its highlight after changing the app language, which also hid the PS5 Library filter, + button and streamability icons until the tab was tapped again.
        - Fixed the focus highlight on the back, filter, refresh and other toolbar buttons (Add Game, Trophies, Friends, Settings and more) staying pink when a different theme colour is selected.
        - Tapping refresh on the Add Game page now reloads the game list from PlayStation and refreshes PS Plus information at most once an hour each, to avoid repeated large downloads. Taps inside that hour show the saved list and say so.
        - Long game titles on the game tiles (library, catalogs and Add Game) now scroll across when the tile is highlighted with the controller or D-pad, or hovered with a mouse, and stay still with a trailing … otherwise.
        - Removed the in-stream trophy unlock popups. This also stops the app asking PlayStation for your trophies every 30 seconds during Game Library and Game Catalog streams. Trophies can still be viewed in the Trophies screens.
        - Fewer requests to PlayStation servers: the friends list reuses saved profiles instead of fetching every friend each time, trophy details are kept for an hour, and returning to the Remote Play tab refreshes the console list at most once a minute. If the PS Plus lookup ever fails, the app waits 30 minutes before asking again.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install Python grpc tools
        run: |
          python3 -m pip install --only-binary=:all: grpcio-tools

      - name: Validate Discord release webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *)
              echo "::error::DISCORD_RELEASE_WEBHOOK_URL is missing or is not a valid Discord webhook URL."
              exit 1
              ;;
          esac

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          # This job builds the *debug* variant (see the "Build APK" step below) and signs it
          # with this keystore — never falling back to Android's auto-generated debug key,
          # since that key is regenerated fresh on every ephemeral Actions runner, so a release
          # built without it carries a different signature than every other release; users who
          # installed one would then hit "App not installed as package conflicts with an
          # existing package" on their next update and have to uninstall + reinstall to recover.
          # Hard-fail here so a missing/misconfigured secret can't silently ship a mismatched
          # signature.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ]; then
            echo "::error::One or more PYLUX_KEYSTORE_* secrets (PYLUX_KEYSTORE_BASE64, PYLUX_KEYSTORE_STORE_PASSWORD, PYLUX_KEYSTORE_KEY_ALIAS, PYLUX_KEYSTORE_KEY_PASSWORD) are missing. Set them in Settings > Secrets and variables > Actions before releasing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
          # app/build.gradle resolves this path via Gradle's file(), which is relative to the
          # *app* module dir (android/app), not this "android" working-directory — so reaching
          # the keystore written one line above (at android/pylux-release.jks) needs exactly
          # one "..", not "../android/..". Matches the working local.properties convention
          # already used for local debug builds (chiakiKeystore=../pylux-debug.jks).
          echo "chiakiKeystore=../pylux-release.jks" >> local.properties
          echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
          echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
          echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
          echo "Signing enabled"

      # Runs before the build (not after, as this used to) — the version it computes is baked
      # into the APK itself via ANDROID_VERSION_NAME below, so the tag a GitHub Release is filed
      # under and the version the resulting app actually reports in Settings > About now match.
      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.1.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.1.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.1\.//')
            VERSION="0.1.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp "frontend assets/cloudpad-hero.png" release/cloudpad-hero.png
          cp "frontend assets/cloudpad-icon.png" release/cloudpad-icon.png
          cp "frontend assets/cloudpad-logo.png" release/cloudpad-logo.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            ${{ env.RELEASE_NOTES }}

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png

      - name: Announce release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg url "$RELEASE_URL" \
            '{
              username: "CloudPad Releases",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("CloudPad Beta " + $version + " is available"),
                description: $notes,
                url: $url,
                color: 16738740,
                fields: [{
                  name: "Download",
                  value: ("[View release and download the APK](" + $url + ")")
                }]
              }]
            }' > discord-payload.json

          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json" \
            --data @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true"
