name: Build APK Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install protoc and Python grpc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install grpcio-tools

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
            echo "chiakiKeystore=../android/pylux-release.jks" >> local.properties
            echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
            echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
            echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
            echo "Signing enabled"
          else
            echo "No keystore secret found — build will use default debug signing (updates may require reinstall)"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp android/app/src/main/assets/FrontendArt/cloudpad-hero.png release/cloudpad-hero.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-icon.png release/cloudpad-icon.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-logo.png release/cloudpad-logo.png

      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.0.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.0.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.0\.//')
            VERSION="0.0.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            - In-stream Quick Settings' Session tab now applies resolution/FPS/bitrate/codec (Remote Play) or resolution/datacenter/bitrate (Cloud Play) changes without leaving the stream: an Apply button appears once you change a setting and disappears if you revert it, and tapping it restarts the stream in place with the new settings.
            - Fixed several native crashes and a stray "session has quit" dialog that could occur when restarting a Remote Play or Cloud Play stream.
            - Fixed controller D-pad navigation in the Quick Settings panel: pressing down past the last tab icon (Friends) could re-enter that tab's content instead of moving to the Disconnect button below the tab rail.
            - Fixed the Remote Play console list flickering between two different tile styles when local network discovery briefly missed a beat.
            - Console status on the Remote Play list is now more specific: green "Ready" (powered on), yellow "Asleep" (rest mode), red "Offline" (manually-added console not currently reachable), or blue "Finding console" (known via PSN, not yet confirmed on the local network).
            - The platform badge on each console tile now reads "PS5"/"PS4" instead of just "5"/"4".
            - Remote Play's power icon now asks what to do: put the console to sleep or disconnect the session, matching the app's standard dialog style. Cloud Play's power icon is unchanged (still an instant disconnect).
            - A console confirmed asleep now reliably stays showing "Asleep" instead of reverting to "Finding console" a few seconds later, since a sleeping console going quiet on the network is expected, not a sign it's unreachable.

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png
