name: Build APK Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install protoc and Python grpc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install grpcio-tools

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
            echo "chiakiKeystore=../android/pylux-release.jks" >> local.properties
            echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
            echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
            echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
            echo "Signing enabled"
          else
            echo "No keystore secret found — build will use default debug signing (updates may require reinstall)"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp android/app/src/main/assets/FrontendArt/cloudpad-hero.png release/cloudpad-hero.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-icon.png release/cloudpad-icon.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-logo.png release/cloudpad-logo.png

      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.0.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.0.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.0\.//')
            VERSION="0.0.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            - Changed the Quick Settings Disconnect button to a power icon pinned bottom-left, always tinted with the app's current theme colour (Pink/Blue/Green/Yellow/Orange), instead of a text button at the top
            - Removed the Save button from Quick Settings: every setting (Performance Overlay, On-Screen Controls, Touchpad Only, Window Size, controller remapping) now applies and takes effect on the live stream the instant you change it, instead of waiting to be saved
            - Renamed "Stats" to "Performance Overlay" in Quick Settings, and shrank the row label text slightly so longer titles like this fit cleanly next to their switch
            - Swapped the Quick Settings panel's tab order: the cog (general settings) icon is now on top, with the controller (remap) icon below it
            - Fixed the Quick Settings panel's new Controller tab not showing every controller mapping: the remap list was sized wrap_content inside a shared scroll view, which doesn't reliably measure a RecyclerView's full content once it switches from hidden to visible — it now gets its own bounded area with internal scrolling, the same approach the full-screen Remap Controller screen already used successfully
            - Split the Quick Settings panel into two tabs on the left-hand side: a controller icon for Remap Controller, and a cog icon for everything else (Stats, On-Screen Controls, Touchpad Only, Window Size, Motion, Touch Haptics, Picture-in-Picture); Disconnect stays pinned at the top regardless of tab. The active tab is highlighted in the app's theme colour, matching the rest of the panel
            - Fixed L2/R2 not responding to a gradual squeeze (only registering once fully pressed): DualShock/DualSense controllers report trigger travel on a different axis code (AXIS_BRAKE/AXIS_GAS) than the one the app was reading (AXIS_LTRIGGER/AXIS_RTRIGGER), so no analog data was ever seen for those pads — the app now checks both axis codes and uses whichever the connected controller actually populates, restoring true analog trigger pressure for racing games and similar
            - Made L2/R2 more responsive to a light squeeze: trigger travel now front-loads towards higher analog output early in the press instead of scaling linearly with raw travel, so it engages sooner while still reaching full value at a complete press
            - Removed leftover diagnostic logging from the Quick Settings panel (added while tracking down an earlier rendering bug, now fixed) that was printing a stack trace to Logcat every time the panel opened or closed
            - Removed the Microphone feature entirely (Settings toggle, in-stream toggle and native capture pipeline): PS Cloud Play sessions never establish the console control connection the mic signal relies on, so it could never actually reach the console/cloud backend for this app's use case

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png
