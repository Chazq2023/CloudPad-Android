name: Build APK Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install protoc and Python grpc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install grpcio-tools

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
            echo "chiakiKeystore=../android/pylux-release.jks" >> local.properties
            echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
            echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
            echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
            echo "Signing enabled"
          else
            echo "No keystore secret found — build will use default debug signing (updates may require reinstall)"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp android/app/src/main/assets/FrontendArt/cloudpad-hero.png release/cloudpad-hero.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-icon.png release/cloudpad-icon.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-logo.png release/cloudpad-logo.png

      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.0.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.0.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.0\.//')
            VERSION="0.0.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            - Added 5 de-listed games (Destruction AllStars, Divine Knockout, PGA Tour 2K23, WWE 2K22, WWE 2K24) as hardcoded catalog entries: removed from the PS Store but still streamable via PS Cloud for outright owners; Sony's imagic API no longer lists them
            - Fixed Witcher 3 (GOTY PPSA03977) and Nioh 2 Remastered (PPSA02488) appearing in library but failing to stream: the imagic catalog lists different PPSA numbers than the user's actual owned entitlement; Gaikai validates against what the user owns, so hardcoded entries now use the owned PPSA directly
            - Fixed Nioh 2 Remastered incorrectly routed to psnow instead of pscloud: PS4 purchase storeProductId (CUSA) was poisoning platform detection; streamPlatform now checks productId+entitlementId PPSA pair first
            - Fixed Nioh 2 Remastered for non-EU users: when a PS4 purchase (CUSA) entitles a PS5 upgrade (PPSA entitlementId), the user's actual regional PPSA is now sent to Gaikai instead of the hardcoded EU catalog productId
            - All hardcoded catalog entries match via PPSA stable key so regional variants (EP/UP/JP prefix) resolve globally; streamingIdentifier sends the user's own regional productId to Gaikai when the only difference is the publisher prefix (EP vs UP vs JP)
            - PS5 Library now always performs a live refresh (no cache) when the app opens, when switching to the Library tab from PS4 Catalog, or when tapping the Library tab while already on it — ensures de-listed owned games appear immediately without requiring a manual refresh

            ### Known Issues
            - 1080p seems to cause microstutter, this is being looked into. If you are experiencing this issue, use 720p for now.

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png
