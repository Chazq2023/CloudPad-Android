name: Build APK Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Install CMake 3.30.4
        run: sdkmanager "cmake;3.30.4"

      - name: Install protoc and Python grpc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install grpcio-tools

      - name: Set up signing keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.PYLUX_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.PYLUX_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.PYLUX_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > pylux-release.jks
            echo "chiakiKeystore=../android/pylux-release.jks" >> local.properties
            echo "chiakiKeystorePW=${KEYSTORE_STORE_PASSWORD}" >> local.properties
            echo "chiakiKeyAlias=${KEYSTORE_KEY_ALIAS}" >> local.properties
            echo "chiakiKeyPW=${KEYSTORE_KEY_PASSWORD}" >> local.properties
            echo "Signing enabled"
          else
            echo "No keystore secret found — build will use default debug signing (updates may require reinstall)"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/cloudpad-android.apk
          cp android/app/src/main/assets/FrontendArt/cloudpad-hero.png release/cloudpad-hero.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-icon.png release/cloudpad-icon.png
          cp android/app/src/main/assets/FrontendArt/cloudpad-logo.png release/cloudpad-logo.png

      - name: Compute version
        run: |
          git fetch --tags
          LATEST=$(git tag -l "v0.0.*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="0.0.1"
          else
            PATCH=$(echo "$LATEST" | sed 's/v0\.0\.//')
            VERSION="0.0.$((PATCH + 1))"
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          git tag $TAG
          git push origin $TAG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CloudPad Beta Release ${{ env.VERSION }}
          body: |
            ## CloudPad Beta Release ${{ env.VERSION }}

            ### Updates
            - Added a Microphone setting (off by default) that streams real mic audio to the console for Remote Play/party voice chat, using native Oboe capture + the existing Opus encoder pipeline already used by other Chiaki platforms; requests the RECORD_AUDIO permission only from the Settings screen so it never interrupts an active stream
            - Replaced the in-stream bottom overlay bar entirely with a Quick Settings slide-in panel, opened by pressing back: Disconnect, Stats, Microphone, On-Screen Controls, Touchpad Only and Window Size all now live there
            - Disconnect is pinned at the top of the panel (always visible, doesn't scroll); Stats, Microphone, On-Screen Controls, Touchpad Only and Window Size are staged — changes only take effect when Save is pressed, and are discarded if you press back again instead; On-Screen Controls and Touchpad Only remain mutually exclusive
            - Quick Settings panel text now follows the app's selected theme colour, matching the rest of the app; removed the Theme Colour picker from the panel (still changeable from Settings)
            - Motion, Touch Haptics and Picture-in-Picture toggles in the panel still take effect immediately on the live stream; Remap Controller edits save immediately and take effect on the current stream once Save is pressed
            - Extracted the controller remap "listen for next input" logic into a shared component so it's used identically by both the full-screen Settings > Remap Controller screen and the in-stream panel
            - Fixed a crash launching any game while the default Neon Pink theme was selected, caused by the new Quick Settings panel referencing a theme colour attribute the stream screen's theme didn't declare for that colour
            - Window Size icons in the Quick Settings panel are now white by default, with the selected option shown in the theme colour so the current selection stands out clearly
            - Remap Controller section headers (e.g. LEFT STICK, RIGHT STICK) and the current-mapping text now use the theme colour; action names (e.g. "Left Stick Up") stay a fixed white for readability
            - Fixed the console/game never recognising the microphone as enabled: the STREAMINFO capability the app announced to the console had a malformed audio format (this was a bug in the shared cross-platform protocol library, not Android-specific)
            - Fixed the microphone not actually turning off when disabled — the app now genuinely stops the mic capture stream instead of just muting the outgoing audio, which should also release the OS mic/recording indicator
            - Added voice-communication audio routing (MODE_IN_COMMUNICATION) while the mic is active, to better prefer a connected headset's microphone over the phone's built-in one
            - Fixed controller remapping capturing a spurious combo (e.g. R2 + Axis RTRIGGER) instead of a clean analog input when mapping L2/R2 or an analog stick direction — some controllers send both a digital button event and an analog axis event for the same physical trigger/stick push
            - Fixed the Quick Settings panel getting stuck off-screen on reopen: it's no longer toggled GONE/VISIBLE (which could conflict with the video surface's own rendering layer) — it now stays permanently visible and only ever slides via a position transform

            ### APK
            Attached release asset:
            `cloudpad-android.apk`

          files: |
            release/cloudpad-android.apk
            release/cloudpad-hero.png
            release/cloudpad-icon.png
            release/cloudpad-logo.png
